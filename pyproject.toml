[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "dsdvc"
version = "1.0.0"
description = "Dynamic Social Diffusion, Virality, Conversion & Marketing Intelligence Platform"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Proprietary" }
dependencies = [
  "numpy>=1.26", "pandas>=2.2", "networkx>=3.3", "scipy>=1.13", "scikit-learn>=1.5",
  "pydantic>=2.7", "fastapi>=0.111", "python-multipart>=0.0.9", "uvicorn>=0.30", "httpx>=0.27", "sqlalchemy>=2.0",
  "requests>=2.32", "streamlit>=1.45", "plotly>=5.22", "tabulate>=0.9", "openpyxl>=3.1", "python-pptx>=1.0", "alembic>=1.13", "PyJWT[crypto]>=2.9", "Authlib>=1.3.2", "boto3>=1.34",
]

[project.optional-dependencies]
ml = ["lightgbm>=4.3", "shap>=0.45", "python-igraph>=0.11", "leidenalg>=0.10"]
prod = ["psycopg[binary]>=3.1", "redis>=5", "mlflow-skinny>=2.14"]
llm = ["anthropic>=0.70"]
dev = ["pytest>=8", "moto[s3]>=5.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
markers = ["slow: longer simulation tests"]
filterwarnings = ["ignore::DeprecationWarning", "ignore::FutureWarning", "ignore::UserWarning"]
